<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="flex justify-center">
    <div class="w-[600px] bg-blue-300 p-4 rounded-xl">
      <div
        id="urdun"
        class="w full h-20 rounded-md bg-gray-400 text-white text-4xl text-end"
      ></div>
      <div class="flex w-full gap-4 mt-12 justify-center">
        <div class="w-2/3 flex gap-2 flex-wrap w-500 justify-center">
          <button
            onclick="getNumber(1)"
            class="w-30 h-30 bg-red-100 rounded-md text-4xl active:bg-violet-600 hover:bg-violet-400"
          >
            1
          </button>
          <button
            onclick="getNumber(2)"
            class="w-30 h-30 bg-red-100 rounded-md text-4xl active:bg-violet-600 hover:bg-violet-400"
          >
            2
          </button>
          <button
            onclick="getNumber(3)"
            class="w-30 h-30 bg-red-100 rounded-md text-4xl active:bg-violet-600 hover:bg-violet-400"
          >
            3
          </button>
          <button
            onclick="getNumber(4)"
            class="w-30 h-30 bg-red-100 rounded-md text-4xl active:bg-violet-600 hover:bg-violet-400"
          >
            4
          </button>
          <button
            onclick="getNumber(5)"
            class="w-30 h-30 bg-red-100 rounded-md text-4xl active:bg-violet-600 hover:bg-violet-400"
          >
            5
          </button>
          <button
            onclick="getNumber(6)"
            class="w-30 h-30 bg-red-100 rounded-md text-4xl active:bg-violet-600 hover:bg-violet-400"
          >
            6
          </button>
          <button
            onclick="getNumber(7)"
            class="w-30 h-30 bg-red-100 rounded-md text-4xl active:bg-violet-600 hover:bg-violet-400"
          >
            7
          </button>
          <button
            onclick="getNumber(8)"
            class="w-30 h-30 bg-red-100 rounded-md text-4xl active:bg-violet-600 hover:bg-violet-400"
          >
            8
          </button>
          <button
            onclick="getNumber(9)"
            class="w-30 h-30 bg-red-100 rounded-md text-4xl active:bg-violet-600 hover:bg-violet-400"
          >
            9
          </button>
          <button
            onclick="getNumber(0)"
            class="w-30 h-30 bg-red-100 rounded-md text-4xl active:bg-violet-600 hover:bg-violet-400"
          >
            0
          </button>

          <button
            onclick="getAction('nemeh')"
            class="w-30 h-30 bg-red-100 rounded-md text-4xl active:bg-violet-600 hover:bg-violet-400"
          >
            +
          </button>
          <button
            onclick="getAction('hasah')"
            class="w-30 h-30 bg-red-100 rounded-md text-4xl active:bg-violet-600 hover:bg-violet-400"
          >
            -
          </button>
          <button
            onclick="showHariu()"
            class="w-30 h-30 bg-red-100 rounded-md text-4xl active:bg-violet-600 hover:bg-violet-400"
          >
            =
          </button>
          <button
            class="w-30 h-30 bg-red-100 rounded-md text-4xl active:bg-violet-600 hover:bg-violet-400"
            onclick="getAction('urjih')"
          >
            *
          </button>
          <button
            onclick="getAction('huvaah')"
            class="w-30 h-30 bg-red-100 rounded-md text-4xl active:bg-violet-600 hover:bg-violet-400"
          >
            /
          </button>
          <button
            class="w-30 h-30 bg-red-100 rounded-md text-4xl active:bg-violet-600 hover:bg-violet-400"
            onclick="clearall()"
          >
            AC
          </button>
        </div>
      </div>
    </div>
    <script src="tooniimashin.js"></script>
  </body>
</html>
